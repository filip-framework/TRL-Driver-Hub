<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery · TRL Driver Hub</title>
  <meta name="description" content="Screenshots and artwork from race nights.">
  <meta name="theme-color" content="#0a0b0f">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="gallery">
<main id="main">
  <section class="page-hero">
    <div class="container">
      <div class="kicker">Media</div>
      <h1>Gallery</h1>
      <p class="lead">Screenshots, liveries and moments from race nights. Placeholders are shown until images are added to the gallery data file.</p>
      <div class="toolbar mt-3" id="gallery-filters"></div>
    </div>
  </section>
  <section class="section">
    <div class="container">
      <div class="gallery" id="gallery"></div>
    </div>
  </section>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
    <button class="lightbox__close" type="button" aria-label="Close">×</button>
    <button class="lightbox__nav lightbox__nav--prev" type="button" aria-label="Previous">‹</button>
    <div class="lightbox__content"><div class="lightbox__img placeholder" id="lightbox-img"></div><div class="lightbox__caption" id="lightbox-caption"></div></div>
    <button class="lightbox__nav lightbox__nav--next" type="button" aria-label="Next">›</button>
  </div>
</main>
<script src="data/config.js"></script>
<script src="data/seasons/2025.js"></script>
<script src="data/seasons/2026.js"></script>
<script src="data/news.js"></script>
<script src="data/gallery.js"></script>
<script src="assets/js/engine.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/pages/gallery.js"></script>
</body>
</html>
