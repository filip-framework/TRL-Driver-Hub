# Deploys the static site to GitHub Pages on every push to the listed branches.
# First run enables Pages automatically (needs the repository to allow GitHub Actions deployments to the
# github-pages environment; see README "Deploying" if the deploy step is blocked by environment rules).
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main, claude/f1-league-site-replica-l2cp2q]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
