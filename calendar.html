<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar · TRL Driver Hub</title>
  <meta name="description" content="Race calendar with local times, sprint weekends and calendar export.">
  <meta name="theme-color" content="#0a0b0f">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="calendar">
<main id="main">
  <section class="page-hero">
    <div class="container">
      <div class="kicker">Schedule</div>
      <h1>Calendar</h1>
      <p class="lead" id="intro"></p>
      <div class="toolbar mt-3">
        <label class="sr-only" for="season-select">Season</label>
        <select class="select" id="season-select"></select>
        <span class="spacer"></span>
        <button class="btn btn--ghost btn--sm" id="ics-season" type="button">Export season (.ics)</button>
      </div>
    </div>
  </section>
  <section class="section">
    <div class="container">
      <div class="tabs" id="tier-tabs"></div>
      <div class="round-list" id="rounds"></div>
    </div>
  </section>
</main>
<script src="data/config.js"></script>
<script src="data/seasons/2025.js"></script>
<script src="data/seasons/2026.js"></script>
<script src="data/news.js"></script>
<script src="data/gallery.js"></script>
<script src="assets/js/engine.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/pages/calendar.js"></script>
</body>
</html>
